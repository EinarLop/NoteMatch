[llm]
provider = "ollama"               # "ollama" | "anthropic"
model = "qwen3:4b-instruct"       # non-thinking variant; plain "qwen3:4b" is thinking-only
think = false
# Ollama address comes from the OLLAMA_HOST env var (default localhost)
temperature = 0.0
max_retries = 2

[embedding]                       # always via Ollama
model = "nomic-embed-text"
query_prefix = "search_query: "
document_prefix = "search_document: "
# Experiment B: tuned separately on dev. Plateau tau_topic 0.65–0.66 (narrow), tau_min irrelevant with one "topic".
tau_topic = 0.655
tau_min = 0.06

[retrieval]
mode = "whole_prompt"             # experiment B (design 7.4): embed the whole prompt, no LLM parse
max_results = 3

[ingestion]
toc_stoplist = ["introduction", "preface", "index", "references", "bibliography",
                "contents", "exercises", "summary of key concepts"]

[paths]
catalog = "catalog"
index = "index"
